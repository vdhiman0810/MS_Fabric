trigger:
- master

pr:
- master

pool:
  vmImage: ubuntu-latest

stages:
- stage: Validate
  displayName: Validate Repository Standards
  jobs:
  - job: ValidateFiles
    displayName: Validate manifests and structure
    steps:
    - checkout: self
    - task: PowerShell@2
      displayName: Validate required folders
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $required = @(
            "docs",
            "platform",
            "automation",
            "cicd",
            "backlog"
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing required path: $path"
            }
          }

          Write-Host "Repository structure validation passed."

- stage: DeployDevFoundation
  displayName: Deploy Development Foundation
  dependsOn: Validate
  condition: succeeded()
  jobs:
  - job: FabricFoundation
    displayName: Fabric workspace bootstrap
    steps:
    - checkout: self
    - task: AzureCLI@2
      displayName: Placeholder for Fabric REST automation
      inputs:
        azureSubscription: fabric-platform-sp
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          Write-Host "Replace this placeholder with Fabric REST API bootstrap steps."
          Write-Host "Expected actions: capture tenant baseline, create workspaces, and initialize deployment scaffolding."
