name: Deploy Fabric Workspaces

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Workspace config environment folder to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
      mode:
        description: "Run validation only or validation plus deployment"
        required: true
        default: "validate"
        type: choice
        options:
          - validate
          - deploy
  push:
    branches:
      - master
    paths:
      - ".github/workflows/deploy-fabric-workspaces.yml"
      - "automation/powershell/**"
      - "platform/workspaces/**"

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate Workspace Configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workspace configs
        shell: pwsh
        run: |
          ./automation/powershell/Test-FabricWorkspaceConfigs.ps1 -ConfigDirectory "platform/workspaces/${{ github.event.inputs.environment || 'dev' }}"

  deploy:
    name: Deploy Workspace Configs
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'deploy'
    env:
      FABRIC_CONFIG_DIRECTORY: platform/workspaces/${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Verify Azure CLI login
        shell: pwsh
        run: |
          az account show

      - name: Deploy Fabric workspace configs
        shell: pwsh
        run: |
          ./automation/powershell/Deploy-FabricWorkspaceConfigs.ps1 -ConfigDirectory $env:FABRIC_CONFIG_DIRECTORY
