name: Deploy Fabric Workspaces

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Workspace config environment folder to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
      mode:
        description: "Run validation only or validation plus deployment"
        required: true
        default: "validate"
        type: choice
        options:
          - validate
          - deploy
  push:
    branches:
      - master
    paths:
      - ".github/workflows/deploy-fabric-workspaces.yml"
      - "automation/powershell/**"
      - "platform/workspaces/**"

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate Workspace Configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PowerShell
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate JSON config files
        shell: pwsh
        run: |
          $configPath = Join-Path $PWD "platform/workspaces/${{ github.event.inputs.environment || 'dev' }}"
          if (-not (Test-Path $configPath)) {
            throw "Workspace config directory not found: $configPath"
          }

          $files = Get-ChildItem -Path $configPath -Filter *.json
          if (-not $files) {
            throw "No workspace config files were found in $configPath"
          }

          foreach ($file in $files) {
            Write-Host "Validating $($file.Name)"
            $config = Get-Content -LiteralPath $file.FullName | ConvertFrom-Json

            foreach ($required in @("name", "description", "ownerGroup", "roles")) {
              if (-not $config.PSObject.Properties[$required]) {
                throw "Missing required property '$required' in $($file.Name)"
              }
            }
          }

          Write-Host "Workspace config validation passed."

  deploy:
    name: Deploy Workspace Configs
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'deploy'
    env:
      FABRIC_CONFIG_DIRECTORY: platform/workspaces/${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure CLI login
        shell: pwsh
        run: |
          az account show

      - name: Deploy Fabric workspace configs
        shell: pwsh
        run: |
          ./automation/powershell/Deploy-FabricWorkspaceConfigs.ps1 -ConfigDirectory $env:FABRIC_CONFIG_DIRECTORY

